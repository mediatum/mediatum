conference:
  # An article in the proceedings of a conference.
  # This entry is identical to the 'inproceedings' entry and is
  # included for compatibility with another text formatting system.
  required:
    - author
    - title
    - booktitle
    - year
  optional:
    - editor
    - pages
    - organization
    - publisher
    - address
    - month
    - note
    - key

manual:
  # Technical documentation.
  required:
    - title
  optional:
    - author
    - organization
    - address
    - edition
    - month
    - year
    - note
    - key

techreport:
  # A report published by a school or other institution,
  # usually numbered within a series.
  required:
    - author
    - title
    - institution
    - year
  optional:
    - type
    - number
    - address
    - month
    - note
    - key

phdthesis:
  # A PhD thesis.
  required:
    - author
    - title
    - school
    - year
  optional:
    - address
    - month
    - note
    - key

inproceedings:
  # An article in the proceedings of a conference.
  required:
    - author
    - title
    - booktitle
    - year
  optional:
    - editor
    - pages
    - organization
    - publisher
    - address
    - month
    - note
    - key

booklet:
  # A work that is printed and bound, but without a named publisher
  # or sponsoring institution.
  required:
    - title
  optional:
    - author
    - howpublished
    - address
    - month
    - year
    - note
    - key

unpublished:
  # A document with an author and title, but not formally published.
  required:
    - author
    - title
    - note
  optional:
    - month
    - year
    - key

misc:
  # Use this type when nothing else seems appropriate.
  required: []
  optional:
    - author
    - title
    - howpublished
    - month
    - year
    - note
    - key

mastersthesis:
  # A Master's thesis.
  required:
    - author
    - title
    - school
    - year
  optional:
    - address
    - month
    - note
    - key

proceedings:
  # The proceedings of a conference.
  required:
    - title
    - year
  optional:
    - editor
    - publisher
    - organization
    - address
    - month
    - note
    - key

book:
  # A book with an explicit publisher.
  required:
    - author or editor
    - title
    - publisher
    - year
  optional:
    - volume
    - series
    - address
    - edition
    - month
    - note
    - key

incollection:
  # A part of a book with its own title.
  required:
    - author
    - title
    - booktitle
    - year
  optional:
    - editor
    - pages
    - organization
    - publisher
    - address
    - month
    - note
    - key

inbook:
  # A part of a book, which may be a chapter and/or a range of pages.
  required:
    - author or editor
    - title
    - chapter and/or pages
    - publisher
    - year
  optional:
    - volume
    - series
    - address
    - edition
    - month
    - note
    - key

article:
  # An article from a journal or magazine.
  required:
    - author
    - title
    - journal
    - year
  optional:
    - volume
    - number
    - pages
    - month
    - note
    - key
