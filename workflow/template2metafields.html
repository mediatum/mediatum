<metal:block metal:define-macro="workflow_step_type_config">
    <h4 i18n:translate="template2metafields-tal-template"> </h4>
    <tal:block tal:condition="python:fileurl">
        <tal:block i18n:translate="template2metafields-current-tal-template"/>
        <a tal:attributes="href fileurl" tal:content="python:'{}  {} Bytes'.format(filebasename, filesize)"/>
        <br/>
        <label>
            <tal:block i18n:translate="template2metafields-replace-tal-template"/>
            <input name="stepsetting_tal-template" id="stepsetting_tal-template" type="file"/>
        </label>
    </tal:block>
    <label tal:condition="python:not fileurl">
        <tal:block i18n:translate="template2metafields-replace-tal-template"/>
        <input name="stepsetting_tal-template" id="stepsetting_tal-template" type="file"/>
    </label>
</metal:block>
